name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Lint + lisans denetimi + platform-bagimsiz unit testler
  # Matrix: Python 3.10 / 3.11 / 3.12 — Ubuntu runner.
  # -------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Unit (py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (test + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff

      - name: Ruff lint
        run: ruff check src tests scripts/check_licenses.py

      - name: License compliance gate (GPL-3.0)
        run: python3 scripts/check_licenses.py

      - name: Run platform-independent tests
        run: |
          set +e
          pytest tests/ -m "not docker and not e2e" -v --tb=short 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^(FAILED|ERROR) " pytest.log | head -30 | while IFS= read -r line; do
              echo "::error file=pytest.log::$line"
            done
            tail -n 35 pytest.log | while IFS= read -r line; do
              echo "::error file=pytest.log::$line"
            done
            exit "$rc"
          fi

  windows-compatibility:
    name: Windows compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Windows test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,input]"
      - name: Run Windows-specific tests
        run: pytest tests/test_agent_clipboard.py -v

  linux-optional-features:
    name: Optional features (QR and GTK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11 python3-pytest python3-qrcode python3-cryptography
      - name: Run optional feature tests
        run: xvfb-run -a /usr/bin/python3 -m pytest tests/test_notifications.py tests/test_qr_pairing.py -v

  # -------------------------------------------------------------------------
  # Job 2: Debian paket (.deb) + Pardus 23 Docker entegrasyon + Release
  # -------------------------------------------------------------------------
  debian-integration:
    name: Debian build & integration
    runs-on: ubuntu-22.04
    needs: [lint-and-test, windows-compatibility, linux-optional-features]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build .deb + Pardus 23 docker integration
        run: |
          set +e
          bash tests/run_docker_test.sh 2>&1 | tee docker_test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 40 docker_test.log | while IFS= read -r line; do
              echo "::error file=docker_test.log::$line"
            done
            exit "$rc"
          fi

      - name: Upload Debian Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pardus-paylasim-deb
          path: |
            pardus-paylasim*.deb
            pardus-paylasim*.deb.sha256
          if-no-files-found: error

      - name: Create GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pardus-paylasim_*_all.deb
            pardus-paylasim_*_all.deb.sha256
            pardus-paylasim.deb
            pardus-paylasim.deb.sha256
          generate_release_notes: true
